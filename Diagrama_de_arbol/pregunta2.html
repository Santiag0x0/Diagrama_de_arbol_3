<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Pregunta 2 - Diagrama de Árbol</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: white;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2rem;
    }

    .container {
      background-color: rgba(0,0,0,0.6);
      padding: 2rem;
      border-radius: 16px;
      box-shadow: 0 0 15px rgba(0,0,0,0.4);
      max-width: 700px;
      width: 100%;
    }

    h2 {
      text-align: center;
      margin-bottom: 1.5rem;
      font-size: 1.8rem;
    }

    .option {
      background-color: #34495e;
      border: 2px solid transparent;
      padding: 1rem;
      border-radius: 10px;
      margin: 0.5rem 0;
      cursor: pointer;
      font-size: 1.1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.3s ease;
    }

    .option:hover {
      background-color: #3d566e;
    }

    .option.correct {
      background-color: #2ecc71 !important;
      border-color: #27ae60;
    }

    .option.incorrect {
      background-color: #e74c3c !important;
      border-color: #c0392b;
    }

    .symbol {
      font-size: 1.5rem;
      display: none;
    }

    .option.correct .symbol.show {
      display: inline;
    }

    .option.incorrect .symbol.show {
      display: inline;
    }

    .disabled {
      pointer-events: none;
      opacity: 0.7;
    }

    .next-button {
      background-color: #3498db;
      color: white;
      padding: 1rem 2rem;
      border: none;
      border-radius: 10px;
      font-size: 1.2rem;
      cursor: pointer;
      display: none;
      margin-top: 1.5rem;
      width: 100%;
    }

    .next-button:hover {
      background-color: #2980b9;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>¿Desde dónde se parte en un diagrama de árbol?</h2>

    <div class="option" onclick="selectOption(this, true)">
      Se parte desde un punto inicial (raíz).
      <span class="symbol">✅</span>
    </div>

    <div class="option" onclick="selectOption(this, false)">
      Se parte desde la última hoja.
      <span class="symbol">❌</span>
    </div>

    <div class="option" onclick="selectOption(this, false)">
      Se parte desde cualquier rama aleatoria.
      <span class="symbol">❌</span>
    </div>

    <div class="option" onclick="selectOption(this, false)">
      Se parte desde un nodo intermedio.
      <span class="symbol">❌</span>
    </div>

    <button class="next-button" onclick="window.location.href='pregunta3.html'">Siguiente Pregunta</button>
  </div>

  <script>
    let answered = false;

    function selectOption(element, isCorrect) {
      if (answered) return;

      answered = true;
      element.classList.add(isCorrect ? "correct" : "incorrect");
      element.querySelector(".symbol").classList.add("show");

      // Desactivar las demás opciones
      const allOptions = document.querySelectorAll(".option");
      allOptions.forEach(opt => {
        opt.classList.add("disabled");
        if (opt !== element && opt.querySelector(".symbol")) {
          opt.querySelector(".symbol").classList.add("show");
        }
      });

      // Mostrar el botón de siguiente pregunta
      const nextButton = document.querySelector(".next-button");
      nextButton.style.display = "block";
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Pregunta 13 - Diagrama de Árbol</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: white;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2rem;
    }
    .container {
      background-color: rgba(0,0,0,0.6);
      padding: 2rem;
      border-radius: 16px;
      box-shadow: 0 0 15px rgba(0,0,0,0.4);
      max-width: 700px;
      width: 100%;
    }
    h2 {
      text-align: center;
      margin-bottom: 1.5rem;
      font-size: 1.8rem;
    }
    .option {
      background-color: #34495e;
      border: 2px solid transparent;
      padding: 1rem;
      border-radius: 10px;
      margin: 0.5rem 0;
      cursor: pointer;
      font-size: 1.1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.3s ease;
    }
    .option:hover {
      background-color: #3d566e;
    }
    .option.correct {
      background-color: #2ecc71 !important;
      border-color: #27ae60;
    }
    .option.incorrect {
      background-color: #e74c3c !important;
      border-color: #c0392b;
    }
    .symbol {
      font-size: 1.5rem;
      display: none;
    }
    .option.correct .symbol.show,
    .option.incorrect .symbol.show {
      display: inline;
    }
    .disabled {
      pointer-events: none;
      opacity: 0.7;
    }
    .next-button {
      background-color: #3498db;
      color: white;
      padding: 1rem 2rem;
      border: none;
      border-radius: 10px;
      font-size: 1.2rem;
      cursor: pointer;
      display: none;
      margin-top: 1.5rem;
      width: 100%;
    }
    .next-button:hover {
      background-color: #2980b9;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>¿Qué representa cada nivel en un diagrama de árbol?</h2>

    <div class="option" onclick="selectOption(this, true)">
      Cada etapa sucesiva del experimento, mostrando decisiones o resultados en orden.
      <span class="symbol">✅</span>
    </div>

    <div class="option" onclick="selectOption(this, false)">
      El número total de resultados finales.
      <span class="symbol">❌</span>
    </div>

    <div class="option" onclick="selectOption(this, false)">
      La probabilidad acumulada de todas las rutas.
      <span class="symbol">❌</span>
    </div>

    <div class="option" onclick="selectOption(this, false)">
      La cantidad de ramas sin importancia.
      <span class="symbol">❌</span>
    </div>

    <button class="next-button" onclick="window.location.href='pregunta14.html'">Siguiente pregunta</button>
  </div>

  <script>
    let answered = false;
    function selectOption(element, isCorrect) {
      if (answered) return;
      answered = true;
      element.classList.add(isCorrect ? 'correct' : 'incorrect');
      element.querySelector('.symbol').classList.add('show');
      document.querySelectorAll('.option').forEach(opt => {
        opt.classList.add('disabled');
        if (opt !== element) {
          opt.querySelector('.symbol').classList.add('show');
        }
      });
      document.querySelector('.next-button').style.display = 'block';
    }
  </script>
</body>
</html>
